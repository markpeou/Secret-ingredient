<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Secret Ingredient</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="description" content="A playful icebreaker: answer a few questions, discover your blend, reveal your dish.">
  <meta name="theme-color" content="#FFE3EA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
  <style>
/* Layout concept: a phone-sized game screen. A slim pink HUD on top, one chunky panel
   of content in the middle, and a dock pinned to the bottom that always holds the next
   step, on a gingham tablecloth. Single light theme by design. */
:root {
  --bg: #FFE3EA;
  --gingham: rgba(214, 64, 110, 0.13);
  --paper: #FFFDF7;
  --ink: #3B1E12;
  --ink-soft: #6A4535;
  --pink: #C8285E;
  --pink-deep: #9C1A45;
  --pink-soft: #FFD0DE;
  --yellow: #FFC93C;
  --yellow-soft: #FFF1C2;
  --sky: #8ED3E8;
  --sky-soft: #DDF3FA;
  --mint: #C7EDCF;
  --focus: #1C5FD0;

  --font-display: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;

  --radius-l: 24px;
  --radius-m: 16px;
  --edge: 4px solid var(--ink);
  --lift: 0 5px 0 var(--ink);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}

* { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; }
body {
  height: 100%; margin: 0; overflow: hidden;
  display: flex; flex-direction: column;
  font-family: var(--font-body); font-weight: 700; font-size: 1rem; line-height: 1.45;
  color: var(--ink);
  background-color: var(--bg);
  background-image:
    linear-gradient(90deg, var(--gingham) 50%, transparent 50%),
    linear-gradient(var(--gingham) 50%, transparent 50%);
  background-size: 44px 44px;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }

.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- HUD ---------- */
.hud {
  flex: none; background: var(--pink); border-bottom: var(--edge); box-shadow: 0 4px 0 rgba(59, 30, 18, 0.18);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); position: relative; z-index: 10;
}
.hud-inner {
  max-width: 640px; margin: 0 auto; padding-block: 7px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap;
}
.logo {
  font-family: var(--font-display); font-weight: 700; font-size: 1.12rem; color: #FFFFFF; letter-spacing: 0.01em; white-space: nowrap;
  text-shadow: 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 3px 0 var(--ink);
}
.logo-the { color: var(--yellow); }
body[data-screen="question"] .logo { font-size: 1rem; }
.hud-inner { flex-wrap: nowrap; }
.hud-progress { flex: none; }
.hud-progress { display: flex; gap: 2px; }
.hud-progress .star { width: 14px; height: 14px; fill: rgba(255, 255, 255, 0.35); stroke: var(--ink); stroke-width: 1.8; }
.hud-progress .star.on { fill: var(--yellow); }
.hud-progress .star.now { animation: twinkle 1.2s ease-in-out infinite; }

/* ---------- Shell: the only scroll container ---------- */
.app {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
.screen {
  max-width: 640px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column;
}
.screen.fill { height: 100%; }
.body {
  flex: 1 0 auto; display: flex; flex-direction: column; gap: 12px; padding-block: 14px 12px;
  animation: pop-in 0.3s cubic-bezier(.2, 1.4, .4, 1) both;
}
.fill .body { flex: 1 1 auto; min-height: 0; }

/* The dock: always on screen, holds the next step */
.dock {
  position: sticky; bottom: 0; z-index: 5; flex: none;
  padding-block: 10px 12px; margin-inline: -4px; padding-inline: 4px;
  background: linear-gradient(to top, var(--bg) 78%, rgba(255, 227, 234, 0));
}
.dock-row { display: flex; align-items: center; gap: 8px; }
.dock-row .btn-primary { flex: none; }
.dock-stack { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
.dock-pip { flex: 1; min-width: 0; display: flex; justify-content: center; }
.dock-buttons { display: flex; gap: 6px; }
.dock-buttons .btn { flex: 1 1 0; min-width: 0; padding-inline: 8px; font-size: 0.98rem; }
.dock-buttons .btn[hidden] { display: none; }
.dock-links { display: flex; justify-content: space-between; gap: 6px; }

.card {
  background: var(--paper); border: var(--edge); border-radius: var(--radius-l); box-shadow: var(--lift);
  padding: 16px;
}
.eyebrow {
  font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pink-deep);
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 52px; padding: 10px 24px; border: var(--edge); border-radius: 999px;
  font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; letter-spacing: 0.01em; white-space: nowrap;
  cursor: pointer; box-shadow: var(--lift); transition: transform 0.08s, box-shadow 0.08s, background-color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn-primary { background: var(--pink); color: #FFFFFF; }
@media (hover: hover) { .btn-primary:hover:not(:disabled) { background: var(--pink-deep); } }
.btn-yellow { background: var(--yellow); color: var(--ink); }
@media (hover: hover) { .btn-yellow:hover:not(:disabled) { background: #FFD766; } }
.btn-plain { background: var(--paper); color: var(--ink); }
@media (hover: hover) { .btn-plain:hover:not(:disabled) { background: var(--yellow-soft); } }
.btn:disabled { cursor: not-allowed; background: #E9DCD6; color: #6E5A52; box-shadow: 0 5px 0 #B9A79F; border-color: #8C7A72; }
.btn-wide { width: 100%; }
.btn-small { min-height: 46px; padding: 8px 16px; font-size: 1.02rem; }
.btn-link {
  background: none; border: 0; padding: 8px 6px; min-height: 40px; cursor: pointer;
  font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; color: var(--pink-deep);
  text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px;
}
@media (hover: hover) { .btn-link:hover { color: var(--ink); } }

/* ---------- Pipi + speech bubble ---------- */
.pip { width: 100%; height: 100%; display: block; overflow: visible; }
.pip-row { display: flex; align-items: flex-end; gap: 10px; min-width: 0; }
.pip-box { width: 76px; height: 82px; flex: none; animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
.pip-box.react { animation: hop 0.5s cubic-bezier(.2, 1.6, .4, 1), bob 2.6s 0.5s ease-in-out infinite; }
.pip .eyes.blink { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
.pip-wave { transform-box: fill-box; transform-origin: 20% 90%; animation: wave 1.2s ease-in-out infinite; }
.bubble {
  position: relative; background: #FFFFFF; border: 3px solid var(--ink); border-radius: 18px;
  padding: 8px 12px; font-family: var(--font-display); font-weight: 600; font-size: 1rem; line-height: 1.2;
  box-shadow: 0 3px 0 var(--ink); min-width: 0;
}
/* Tail: an ink triangle with a white triangle on top that also covers the bubble's border */
.bubble::before, .bubble::after {
  content: ""; position: absolute; width: 0; height: 0; border-style: solid; border-color: transparent; pointer-events: none;
}
.bubble::before { left: -14px; bottom: 10px; border-width: 9px 14px 9px 0; border-right-color: var(--ink); }
.bubble::after { left: -8px; bottom: 14px; border-width: 5px 9px 5px 0; border-right-color: #FFFFFF; }
.bubble.pop { animation: bubble-pop 0.35s cubic-bezier(.2, 1.6, .4, 1); }
.pip-row.mini { align-items: center; gap: 8px; }
.pip-row.mini .pip-box, .pip-box.mini-solo { width: 46px; height: 50px; }
.pip-row.mini .bubble { font-size: 0.86rem; padding: 5px 9px; border-width: 2.5px; box-shadow: 0 2px 0 var(--ink); overflow-wrap: normal; hyphens: none; }
.pip-row.mini .bubble::before { left: -11px; bottom: 50%; margin-bottom: -7px; border-width: 7px 11px 7px 0; }
.pip-row.mini .bubble::after { left: -6.5px; bottom: 50%; margin-bottom: -4px; border-width: 4px 7px 4px 0; }

/* ---------- Welcome ---------- */
.welcome .body { justify-content: center; }
.welcome .card { display: flex; flex-direction: column; gap: 10px; padding: 18px; }
.welcome h1 { font-size: clamp(1.9rem, 8vw, 2.7rem); font-weight: 700; color: var(--pink-deep); }
.lede { font-size: 1.05rem; }
.body-copy { display: flex; flex-direction: column; gap: 6px; color: var(--ink-soft); font-size: 0.97rem; max-width: 60ch; }
.ready { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.meta { font-size: 0.88rem; color: var(--ink-soft); text-align: center; }

/* ---------- Questions ---------- */
.question .body { justify-content: center; }
.q-card { padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 6px; flex: none; height: auto; }
/* Question cards slide like a hand of cards: out to the left, the next one in from the right */
.question .body { animation: none; }
.q-card.entering { animation: q-in 0.24s cubic-bezier(.2, .9, .3, 1) both; }
.q-card.entering.from-left { animation-name: q-in-back; }
.q-card.entering .options, .q-card.leaving .options { pointer-events: none; }
.q-card.leaving { animation: q-out 0.17s ease-in both; }
.q-card h2 { margin-bottom: 10px; }
.q-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.q-title { font-family: var(--font-display); font-weight: 600; color: var(--pink-deep); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.82rem; }
.q-count { font-family: var(--font-display); font-weight: 600; font-size: 0.9rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.q-card h2 { font-size: clamp(1.15rem, 4.8vw, 1.5rem); font-weight: 600; }
.options { display: grid; gap: 8px; }
.option {
  display: grid; grid-template-columns: 32px 1fr; align-items: center; gap: 10px;
  min-height: 50px; padding: 7px 12px 7px 8px; cursor: pointer; line-height: 1.3;
  background: #FFFFFF; border: 3px solid var(--ink); border-radius: var(--radius-m); box-shadow: 0 3px 0 var(--ink);
  transition: transform 0.08s, background-color 0.15s, box-shadow 0.08s;
  -webkit-tap-highlight-color: transparent; position: relative;
}
@media (hover: hover) { .option:hover { background: var(--yellow-soft); } }
.option:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.option input { position: absolute; top: 50%; left: 24px; margin: 0; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.option:has(input:focus-visible) { outline: 4px solid var(--focus); outline-offset: 3px; }
.option .badge {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--sky-soft); border: 2.5px solid var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 0.95rem;
}
.option .opt-text { min-width: 0; }
.option:has(input:checked) { background: var(--yellow); animation: squish 0.3s ease; }
.option:has(input:checked) .badge { background: var(--pink); color: #FFFFFF; }

/* ---------- Transition ---------- */
.transition .body { justify-content: center; }
.transition .card { display: flex; flex-direction: column; gap: 10px; text-align: center; align-items: center; padding-block: 20px; }
.transition h1 { font-size: clamp(1.8rem, 7.5vw, 2.4rem); color: var(--pink-deep); }
.transition .body-copy { max-width: 46ch; }
.orb { width: 116px; height: 116px; position: relative; }
.orb span {
  position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--ink);
  background: conic-gradient(from 0deg, var(--pink), var(--yellow), var(--sky), var(--mint), var(--pink));
  animation: spin 6s linear infinite;
}
.orb span + span { inset: 20px; background: var(--paper); animation: none; display: grid; place-items: center; }
.orb-pip { width: 60px; height: 64px; }

/* ---------- Blend ---------- */
.summary { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; padding-block: 12px 14px; }
.summary h1 { font-size: clamp(1.6rem, 7vw, 2.3rem); font-weight: 700; color: var(--pink-deep); }
.overview { font-size: 0.93rem; line-height: 1.4; max-width: 56ch; text-wrap: pretty; }
.summary .gauge { width: 100%; }
.chips {
  list-style: none; margin: 0; padding: 2px 2px 4px; display: flex; flex-wrap: nowrap; gap: 6px; max-width: 100%;
  overflow-x: auto; scrollbar-width: none; -webkit-mask: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
  mask: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
}
.chips::-webkit-scrollbar { display: none; }
/* Centre the row when it fits, scroll it when it doesn't */
.chips > :first-child { margin-left: auto; }
.chips > :last-child { margin-right: auto; }
.chips li { flex: none; white-space: nowrap; }
.chips li { background: var(--mint); border: 2.5px solid var(--ink); border-radius: 999px; padding: 2px 12px; font-family: var(--font-display); font-weight: 600; font-size: 0.92rem; }

/* Gauge: each slice shows its spice character and share */
.gauge { display: flex; height: 58px; border: var(--edge); border-radius: 20px; overflow: hidden; box-shadow: var(--lift); background: #FFFFFF; }
.g-seg {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0;
  border: 0; border-right: 3px solid var(--ink); padding: 0; margin: 0; font: inherit;
  animation: grow 0.9s cubic-bezier(.2, 1.2, .4, 1) both; transform-origin: left;
}
button.g-seg { cursor: pointer; -webkit-tap-highlight-color: transparent; }
@media (hover: hover) { button.g-seg:hover { filter: brightness(1.06); } }
button.g-seg:focus-visible { outline: 4px solid var(--focus); outline-offset: -4px; }
.g-seg.active .g-icon { box-shadow: 0 0 0 3px var(--yellow); }
.g-seg:last-child { border-right: 0; }
.g-icon {
  width: 32px; max-width: calc(100% - 6px); aspect-ratio: 1; border-radius: 50%; background: #FFFFFF;
  border: 2px solid var(--ink); display: grid; place-items: center; overflow: hidden;
}
.g-icon .spice-char { width: 82%; height: 82%; }
.g-pct { font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.g-seg.narrow .g-pct { font-size: 0.74rem; letter-spacing: -0.02em; }
.g-seg.narrow .g-icon { width: 26px; }

/* Spice details: a swipeable row instead of a long list */
.mix { display: flex; flex-direction: column; gap: 6px; }
.mix-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.mix-head h2 { font-size: 1.1rem; color: var(--pink-deep); }
.dots { display: flex; gap: 6px; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--c); padding: 0; cursor: pointer; opacity: 0.45; }
.dot[aria-current="true"] { opacity: 1; transform: scale(1.25); }
.spice-list {
  list-style: none; margin: 0 calc(-1 * var(--gutter-r)) 0 0; padding: 2px var(--gutter-r) 10px 0;
  display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
}
.spice-list::-webkit-scrollbar { display: none; }
.spice-row {
  flex: 0 0 86%; scroll-snap-align: center;
  display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start;
  background: var(--paper); border: var(--edge); border-radius: var(--radius-l); box-shadow: var(--lift); padding: 12px;
}
/* Spice portrait on a plate, ringed by its share of the blend */
.spice-pic {
  width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center;
  background: conic-gradient(var(--c) calc(var(--pct) * 1%), #F3E6DA 0); box-shadow: 0 3px 0 var(--ink);
}
.spice-plate { width: 50px; height: 50px; border-radius: 50%; border: 2.5px solid var(--ink); background: #FFFFFF; display: grid; place-items: center; overflow: hidden; }
.spice-char { width: 42px; height: 42px; display: block; overflow: visible; }
.spice-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.spice-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.spice-head h3 { font-size: 1.2rem; font-weight: 600; }
.pct { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; color: var(--pink-deep); font-variant-numeric: tabular-nums; line-height: 1; }
.role { font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; line-height: 1.5; }
.spice-row .essence { display: none; }
.role-tag { display: inline-block; background: var(--sky-soft); border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; margin-right: 4px; }
.essence { color: var(--ink-soft); font-weight: 700; }
.spice-line { font-size: 0.9rem; line-height: 1.35; }

/* ---------- Dish ---------- */
.stage { position: relative; height: 212px; display: grid; place-items: center; overflow: hidden; flex: none; }
.rays {
  position: absolute; width: 228px; height: 228px; max-width: 100%; aspect-ratio: 1; border-radius: 50%;
  background: repeating-conic-gradient(var(--yellow) 0 12deg, #FFE38A 12deg 24deg);
  border: var(--edge); animation: spin 22s linear infinite;
  -webkit-mask: radial-gradient(circle, #000 64%, transparent 66%); mask: radial-gradient(circle, #000 64%, transparent 66%);
}
.plate-ring { position: absolute; width: 176px; height: 176px; border-radius: 50%; background: var(--paper); border: var(--edge); }
.dish-art { position: relative; width: 204px; max-width: 80%; height: auto; animation: dish-in 0.6s 0.9s cubic-bezier(.2, 1.5, .4, 1) both; }
.cloche { position: absolute; width: 190px; max-width: 70%; top: 52px; animation: lift 1s 0.35s cubic-bezier(.5, -0.3, .4, 1) both; z-index: 2; }
.steam path { animation: steam 2.4s ease-in-out infinite; }
.steam path:nth-child(2) { animation-delay: 0.4s; }
.steam path:nth-child(3) { animation-delay: 0.8s; }
.burst { position: absolute; inset: 0; pointer-events: none; }
.burst .star { position: absolute; width: 26px; height: 26px; fill: var(--yellow); stroke: var(--ink); stroke-width: 1.5; animation: burst 0.9s 1s ease-out both; }
.burst .star:nth-child(1) { left: 8%; top: 16%; --dx: -14px; --dy: -14px; }
.burst .star:nth-child(2) { right: 8%; top: 12%; --dx: 14px; --dy: -16px; }
.burst .star:nth-child(3) { left: 12%; bottom: 20%; --dx: -16px; --dy: 12px; width: 20px; height: 20px; }
.burst .star:nth-child(4) { right: 11%; bottom: 24%; --dx: 16px; --dy: 10px; width: 22px; height: 22px; fill: var(--pink-soft); }
.stamp {
  position: absolute; bottom: 14px; left: 50%; z-index: 3; transform: translateX(-50%) rotate(-4deg);
  background: var(--pink); color: #FFFFFF; border: 3px solid var(--ink); border-radius: 14px; white-space: nowrap;
  padding: 3px 14px; font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; letter-spacing: 0.05em; text-transform: uppercase; box-shadow: 0 4px 0 var(--ink);
  display: flex; align-items: center; gap: 6px; animation: stamp 0.5s 1.4s cubic-bezier(.2, 1.6, .4, 1) both;
}
.stamp .star { width: 15px; height: 15px; fill: var(--yellow); stroke: var(--ink); stroke-width: 1.5; }
.dish-title { text-align: center; display: flex; flex-direction: column; gap: 4px; }
.origin {
  position: absolute; top: 2px; left: 50%; transform: translateX(-50%); z-index: 4; white-space: nowrap;
  display: inline-flex; animation: stamp-in 0.5s 1.2s cubic-bezier(.2, 1.6, .4, 1) both; align-items: center; gap: 6px;
  background: #FFFFFF; border: 2.5px solid var(--ink); border-radius: 999px; padding: 2px 12px 2px 8px; box-shadow: 0 2px 0 var(--ink);
  font-family: var(--font-display); font-weight: 600; font-size: 0.92rem; letter-spacing: 0.02em;
}
.origin .flag { font-size: 1.15rem; line-height: 1; }
.origin .pin { width: 18px; height: 18px; }
.dish-title h1 { font-size: clamp(1.9rem, 8vw, 2.6rem); font-weight: 700; color: var(--pink-deep); }
.subtitle { font-family: var(--font-display); font-weight: 500; font-size: 1.08rem; }
.story { display: flex; flex-direction: column; gap: 6px; padding-block: 12px; }
.story .lead { font-size: 0.93rem; line-height: 1.4; }
.mapping { font-size: 0.88rem; line-height: 1.4; color: var(--ink-soft); }

/* ---------- Card screen ---------- */
.card-screen .body { gap: 6px; padding-block: 6px 4px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex: none; }
.card-head .btn-link { min-height: 34px; padding-block: 4px; }

    flow: 'You like knowing where things are headed.',
    play: 'You tend to keep things on the sincere side.'

  const CONTRASTS = [
    { pair: ['explore', 'steady'], text: 'You love discovering something new, yet you like coming home to something you trust.' },
    { pair: ['warmth', 'space'], text: 'You care deeply about your people, and you still guard your own space. Connected without being consumed.' },
    { pair: ['drive', 'flow'], text: 'You can push hard when it counts, and you also know when to let go.' },

    { pair: ['drive', 'warmth'], text: 'You’re ambitious without leaving anyone behind.' },
    { pair: ['explore', 'space'], text: 'You’ll wander off the map, and you’re perfectly happy to do it alone.' },
    { pair: ['energy', 'observe'], text: 'You can be calm without being passive, and lively without missing the details.' }

  const RECHARGE = {

    space: 'Alone time', observe: 'Quiet details', drive: 'Ticking boxes', flow: 'Going with it', play: 'A good laugh'

    const r = profile.ranked;
    const raw = 30 + blend.reduce((sum, b) => sum + (b.spice.heat || 0) * b.pct, 0);

      g[i ? 'lineTo' : 'moveTo'](cx + rad * Math.cos(a), cy + rad * Math.sin(a));
    }
    g.closePath();
  }

  function flame(g, cx, cy, s) {
    g.save();
    g.translate(cx, cy); g.scale(s, s);
    g.beginPath();
    g.moveTo(0, -14); g.bezierCurveTo(10, -4, 12, 4, 8, 10); g.bezierCurveTo(4, 15, -4, 15, -8, 10);
    g.bezierCurveTo(-12, 4, -8, -2, -4, -4); g.bezierCurveTo(-4, 0, -2, 2, 0, 2); g.bezierCurveTo(2, -4, -2, -8, 0, -14);

  function frame(g, colour) {
    rr(g, 0, 0, W, H, 42); g.fillStyle = INK; g.fill();
    rr(g, 10, 10, W - 20, H - 20, 34); g.fillStyle = mix(colour, '#FFFFFF', 0.55); g.fill();
    g.save(); rr(g, 10, 10, W - 20, H - 20, 34); g.clip(); gingham(g, 10, 10, W - 20, H - 20, 26, '#FFFFFF', 0.28); g.restore();
    rr(g, 26, 26, W - 52, H - 52, 24); g.fillStyle = PAPER; g.fill(); g.lineWidth = 5; g.strokeStyle = INK; g.stroke();
  }

  function pill(g, text, x, y, fill = PINK) {
    font(g, 600, 15, DISPLAY);
    if ('letterSpacing' in g) g.letterSpacing = '1.5px';
    const pw = g.measureText(text).width + 26;
    rr(g, x, y, pw, 26, 13); g.fillStyle = fill; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
    g.fillStyle = '#FFFFFF'; g.textAlign = 'left'; g.fillText(text, x + 13, y + 19);
    if ('letterSpacing' in g) g.letterSpacing = '0px';

  }

  function spiceBadge(g, img, colour, cx, cy, r) {
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fillStyle = colour; g.fill(); g.lineWidth = Math.max(2.5, r / 8); g.strokeStyle = INK; g.stroke();
    g.beginPath(); g.arc(cx, cy, r * 0.78, 0, Math.PI * 2); g.fillStyle = '#FFFFFF'; g.fill(); g.lineWidth = 2; g.stroke();
    g.drawImage(img, cx - r * 0.72, cy - r * 0.72, r * 1.44, r * 1.44);
  }

  // Segmented gauge. With icons, each slice shows the spice and its share.
  function gauge(g, blend, imgFor, x, y, w, h, withIcons) {
    const n = blend.length;
    g.save(); rr(g, x, y, w, h, h / 2.4); g.clip();
    let cx = x;
    blend.forEach((b, i) => {
      const sw = i === n - 1 ? x + w - cx : Math.round((w * b.pct) / 100);
      g.fillStyle = b.spice.colour; g.fillRect(cx, y, sw, h);
      if (i) { g.fillStyle = INK; g.fillRect(cx - 1.5, y, 3, h); }
      g.textAlign = 'center'; g.fillStyle = b.spice.text;
      if (withIcons) {
        const s = Math.min(30, sw - 14);
        g.beginPath(); g.arc(cx + sw / 2, y + 19, s / 2 + 2, 0, Math.PI * 2); g.fillStyle = '#FFFFFF'; g.fill();
        g.drawImage(imgFor(b.spice.id), cx + sw / 2 - s / 2, y + 19 - s / 2, s, s);
        font(g, 700, 16, DISPLAY); g.fillStyle = b.spice.text; g.fillText(b.pct + '%', cx + sw / 2, y + h - 9);
      } else {
        font(g, 700, Math.min(17, h - 8), DISPLAY); g.fillText(b.pct + '%', cx + sw / 2, y + h / 2 + 6);
      }
      cx += sw;
    });
    g.textAlign = 'left'; g.restore();
    rr(g, x, y, w, h, h / 2.4); g.lineWidth = 4; g.strokeStyle = INK; g.stroke();
  }

  function footer(g, card, label) {
    font(g, 800, 13, BODY); g.fillStyle = INK_SOFT; g.textAlign = 'left';
    g.fillText(label, 52, 1014);
    font(g, 600, 15, DISPLAY); g.fillStyle = PINK; g.textAlign = 'center';
    g.fillText('The Secret Ingredient', W / 2, 1015);
    font(g, 800, 13, BODY); g.fillStyle = INK_SOFT; g.textAlign = 'right';
    const num = `No. ${String(card.number).padStart(2, '0')}/${card.total}`;
    g.fillText(num, W - 52 - (card.rarity * 16 + 6), 1014);
    for (let k = 0; k < card.rarity; k++) {
      starPath(g, W - 60 - k * 16, 1009, 7); g.fillStyle = '#FFC93C'; g.fill(); g.lineWidth = 1.6; g.strokeStyle = INK; g.stroke();
    }
    g.textAlign = 'left';
  }

  function newCanvas() {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.textBaseline = 'alphabetic';
    return [c, g];
  }

  /* ---------- Front ---------- */
  function drawFront(result, imgs) {
    const { blend, dish, text } = result;
    const card = text.card;
    const top = blend[0].spice;
    const [c, g] = newCanvas();
    frame(g, top.colour);

    const pillW = pill(g, 'SIGNATURE DISH', 46, 40);
    const badgeX = W - 78, badgeY = 82;
    spiceBadge(g, imgs.spice(top.id), top.colour, badgeX, badgeY, 32);
    font(g, 700, 44, DISPLAY);
    const heatStr = String(card.heat);
    const numW = g.measureText(heatStr).width;
    const numRight = badgeX - 44;
    g.fillStyle = INK; g.textAlign = 'right'; g.fillText(heatStr, numRight, 104);
    font(g, 800, 15, BODY); g.fillStyle = INK_SOFT; g.fillText('HEAT', numRight - numW - 30, 100);
    flame(g, numRight - numW - 14, 92, 0.9);
    g.textAlign = 'left';
    // "Dish – Country": the origin sits beside the name in a lighter, smaller weight.
    // Long names keep their size and the origin moves up beside the Signature dish tag.
    font(g, 800, 15, BODY);
    const maxW = numRight - numW - 30 - g.measureText('HEAT').width - 18 - 48;
    const flagTxt = SI.flags.supported() && dish.flag ? dish.flag + ' ' : '';
    const origin = ' – ' + flagTxt + dish.origin;
    let ns = 48, os;
    const measure = () => {
      os = Math.round(ns * 0.56);
      font(g, 700, ns, DISPLAY); const w1 = g.measureText(dish.name).width;
      font(g, 600, os, DISPLAY); const w2 = g.measureText(origin).width;
      return w1 + w2;
    };
    while (measure() > maxW && ns > 34) ns -= 1;
    if (measure() <= maxW) {
      const nameY = 112 - (48 - ns) * 0.25;
      font(g, 700, ns, DISPLAY); g.fillStyle = INK; g.fillText(dish.name, 48, nameY);
      const nw = g.measureText(dish.name).width;
      font(g, 600, os, DISPLAY); g.fillStyle = PINK_DEEP; g.fillText(origin, 48 + nw, nameY);
    } else {
      const size = fitText(g, dish.name, maxW, 700, 44, DISPLAY, 22);
      g.fillStyle = INK; g.fillText(dish.name, 48, 112 - (44 - size) * 0.25);
      fitText(g, flagTxt + dish.origin, numRight - numW - 90 - (46 + pillW + 10), 600, 20, DISPLAY, 13);
      g.fillStyle = PINK_DEEP; g.fillText(flagTxt + dish.origin, 46 + pillW + 10, 60);
    }

    // Art window
    const ax = 46, ay = 126, aw = W - 92, ah = 328;
    g.save();
    rr(g, ax, ay, aw, ah, 18); g.clip();
    g.fillStyle = '#FFE38A'; g.fillRect(ax, ay, aw, ah);
    const cx = W / 2, cy = 280;
    for (let i = 0; i < 28; i += 2) {
      const a1 = (i * Math.PI * 2) / 28, a2 = ((i + 1) * Math.PI * 2) / 28;
      g.beginPath(); g.moveTo(cx, cy);
      g.lineTo(cx + 800 * Math.cos(a1), cy + 800 * Math.sin(a1));
      g.lineTo(cx + 800 * Math.cos(a2), cy + 800 * Math.sin(a2));
      g.closePath(); g.fillStyle = '#FFC93C'; g.fill();
    }
    const tableY = ay + ah - 62;
    g.fillStyle = '#FFD0DE'; g.fillRect(ax, tableY, aw, 62);
    gingham(g, ax, tableY, aw, 62, 22, '#F07FA6', 0.4);
    g.fillStyle = INK; g.fillRect(ax, tableY, aw, 4);
    g.drawImage(imgs.dish, cx - 155, 134, 310, 294);
    g.drawImage(imgs.pip, ax + 12, ay + 10, 104, 111);
    g.restore();
    rr(g, ax, ay, aw, ah, 18); g.lineWidth = 5; g.strokeStyle = INK; g.stroke();

    // Ribbon
    const sy = 464, sx = 70, sw = W - 140, sh = 34;
    g.beginPath();
    g.moveTo(sx - 14, sy); g.lineTo(sx + sw + 14, sy); g.lineTo(sx + sw, sy + sh / 2); g.lineTo(sx + sw + 14, sy + sh);
    g.lineTo(sx - 14, sy + sh); g.lineTo(sx, sy + sh / 2); g.closePath();
    g.fillStyle = PINK_DEEP; g.fill();
    const strip = text.name;
    fitText(g, strip, sw - 20, 800, 17, BODY, 12);
    g.font = 'italic ' + g.font;
    g.fillStyle = '#FFFFFF'; g.textAlign = 'center'; g.fillText(strip, W / 2, sy + 23); g.textAlign = 'left';

    const label = (t, x, y, align = 'left') => {
      font(g, 800, 13, BODY); g.fillStyle = INK_SOFT; g.textAlign = align;
      if ('letterSpacing' in g) g.letterSpacing = '1.2px';
      g.fillText(t, x, y);
      if ('letterSpacing' in g) g.letterSpacing = '0px';
      g.textAlign = 'left';
    };

    // Strengths
    rr(g, 52, 512, W - 104, 138, 16); g.fillStyle = '#E3F6E6'; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
    label('STRENGTHS', 74, 538);
    card.strengths.forEach((st, i) => {
      const y = 570 + i * 31;
      starPath(g, 84, y - 7, 9); g.fillStyle = '#FFC93C'; g.fill(); g.lineWidth = 1.8; g.strokeStyle = INK; g.stroke();
      fitText(g, st, W - 190, 600, 21, DISPLAY, 15); g.fillStyle = INK; g.fillText(st, 104, y);
    });

    spiceBadge(g, imgs.spice(top.id), top.colour, W - 106, 581, 38);

    // Trait grid
    const cells = [['WEAKNESS', card.weakness], ['RESISTS', card.resists], ['RECHARGES WITH', card.recharge], ['CLICKS WITH', card.clicks]];
    const gx = 52, gy = 664, cw = (W - 104) / 2, ch = 70;
    rr(g, gx, gy, W - 104, ch * 2, 16); g.fillStyle = '#FFFFFF'; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
    g.fillStyle = 'rgba(59,30,18,0.18)'; g.fillRect(gx + cw - 1, gy + 10, 2, ch * 2 - 20); g.fillRect(gx + 14, gy + ch - 1, W - 132, 2);
    cells.forEach(([lab, value], i) => {
      const x = gx + (i % 2) * cw + 22, y = gy + Math.floor(i / 2) * ch;
      label(lab, x, y + 28);
      fitText(g, value, cw - 40, 600, 22, DISPLAY, 14); g.fillStyle = INK; g.fillText(value, x, y + 56);
    });

    // Signature move
    const m = card.moves[0];
    const my = 818;
    label('SIGNATURE MOVE', 52, my + 18);
    for (let k = 0; k < m.cost; k++) spiceBadge(g, imgs.spice(m.spice.id), m.spice.colour, 70 + k * 28, my + 46, 18);
    fitText(g, m.name, 420, 600, 29, DISPLAY, 20);
    g.fillStyle = INK; g.fillText(m.name, 70 + m.cost * 28 + 8, my + 56);
    font(g, 700, 34, DISPLAY); g.textAlign = 'right'; g.fillStyle = PINK_DEEP;
    g.fillText(String(m.pct), W - 82, my + 56);
    font(g, 700, 18, DISPLAY); g.fillText('%', W - 60, my + 56);
    g.textAlign = 'left'; g.fillStyle = INK_SOFT;
    wrap(g, m.text, 52, my + 88, W - 104, 23, 2, 700, 18, 14);

    fitText(g, dish.subtitle, W - 140, 800, 18, BODY, 12);
    g.font = 'italic ' + g.font;
    g.fillStyle = INK; g.textAlign = 'center'; g.fillText(dish.subtitle, W / 2, 975); g.textAlign = 'left';

    footer(g, card, 'Illus. Pipi · Flip for the recipe');
    return c;
  }

  /* ---------- Back ---------- */
  function drawBack(result, imgs) {
    const { blend, dish, text } = result;
    const card = text.card;
    const top = blend[0].spice;
    const [c, g] = newCanvas();
    frame(g, top.colour);

    pill(g, 'THE RECIPE', 46, 40, PINK_DEEP);
    const nameSize = fitText(g, text.name, W - 100, 700, 46, DISPLAY, 26);
    g.fillStyle = INK; g.fillText(text.name, 48, 110 - (46 - nameSize) * 0.25);
    font(g, 800, 17, BODY); g.fillStyle = INK_SOFT;
    g.fillText(`Signature blend for ${dish.name} · ${SI.flags.supported() && dish.flag ? dish.flag + ' ' : ''}${dish.origin}`, 50, 140);

    gauge(g, blend, imgs.spice, 52, 158, W - 104, 30, false);

    // One row per spice
    const n = blend.length;
    const top0 = 206, bottom = 900;
    const rowH = Math.min(150, (bottom - top0) / n);
    blend.forEach((b, i) => {
      const y = top0 + i * rowH;
      const spiceText = text.spices[i];
      const r = Math.min(34, rowH * 0.28);
      spiceBadge(g, imgs.spice(b.spice.id), b.spice.colour, 52 + r, y + r + 10, r);
      const tx = 52 + r * 2 + 18;

      fitText(g, b.spice.name, W - tx - 150, 600, 27, DISPLAY, 18);
      g.fillStyle = INK; g.fillText(b.spice.name, tx, y + 34);
      font(g, 700, 34, DISPLAY); g.fillStyle = PINK_DEEP; g.textAlign = 'right';
      g.fillText(b.pct + '%', W - 56, y + 36); g.textAlign = 'left';

      // Role chip + family
      font(g, 700, 14, DISPLAY);
      const role = spiceText.role;
      const rw = g.measureText(role).width + 18;
      rr(g, tx, y + 44, rw, 22, 11); g.fillStyle = '#DDF3FA'; g.fill(); g.lineWidth = 2; g.strokeStyle = INK; g.stroke();
      g.fillStyle = INK; g.fillText(role, tx + 9, y + 60);
      font(g, 800, 13, BODY); g.fillStyle = INK_SOFT;
      g.fillText((SI.SPICE_FAMILIES[b.spice.family] || '').toUpperCase(), tx + rw + 10, y + 60);

      g.fillStyle = INK_SOFT;
      const maxLines = rowH >= 140 ? 3 : 2;
      wrap(g, spiceText.line, tx, y + 88, W - tx - 56, 21, maxLines, 700, 17, 14);
      if (i < n - 1) { g.fillStyle = 'rgba(59,30,18,0.14)'; g.fillRect(52, y + rowH - 4, W - 104, 2); }
    });

    // Spare room (shorter blends): tell the story of the dish
    const rowsEnd = top0 + n * rowH;
    const boxY = rowsEnd + 6, boxH = 892 - boxY;
    if (boxH >= 110) {
      rr(g, 52, boxY, W - 104, boxH, 16); g.fillStyle = '#FFF1C2'; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
      font(g, 600, 22, DISPLAY); g.fillStyle = PINK_DEEP;
      g.fillText(`Why ${dish.name}?`, 74, boxY + 38);
      g.fillStyle = INK;
      const avail = Math.max(2, Math.floor((boxH - 62) / 25));
      const used = wrap(g, text.dish.story, 74, boxY + 68, W - 148, 25, avail, 700, 18, 15);
      if (avail - used >= 3) { g.fillStyle = INK_SOFT; wrap(g, text.dish.mapping, 74, boxY + 68 + used * 25 + 12, W - 148, 25, avail - used - 1, 700, 17, 14); }
    }

    // Flavour profile chips
    g.fillStyle = INK; g.fillRect(46, 908, W - 92, 3);
    font(g, 800, 13, BODY); g.fillStyle = INK_SOFT; g.textAlign = 'center';
    if ('letterSpacing' in g) g.letterSpacing = '1px';
    g.fillText('FLAVOUR PROFILE', W / 2, 934);
    if ('letterSpacing' in g) g.letterSpacing = '0px';
    font(g, 600, 17, DISPLAY);
    const chips = text.flavour.map((w) => ({ w, width: g.measureText(w).width + 26 }));
    const total = chips.reduce((a, ch) => a + ch.width, 0) + (chips.length - 1) * 8;
    let x = Math.max(52, (W - total) / 2);
    chips.forEach((ch) => {
      if (x + ch.width > W - 52) return;
      rr(g, x, 948, ch.width, 32, 16); g.fillStyle = MINT; g.fill(); g.lineWidth = 2.5; g.strokeStyle = INK; g.stroke();
      g.fillStyle = INK; g.textAlign = 'center'; g.fillText(ch.w, x + ch.width / 2, 970);
      x += ch.width + 8;
    });
    g.textAlign = 'left';

    footer(g, card, 'A playful recipe, not a measurement');
    return c;
  }

  function toBlob(canvas) {
    return new Promise((resolve, reject) => {
      try {
        canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('Could not export card'))), 'image/png');
      } catch (e) { reject(e); }
    });
  }

  async function render(result) {
    await fontsReady();
    const { blend, dish } = result;
    const [dishImg, pipImg, ...spiceImgs] = await Promise.all([
      svgImage(SI.art.dish(dish), 340, 323),
      svgImage(SI.chars.pip('cheer'), 104, 111),
      ...blend.map((b) => svgImage(SI.chars.spice(b.spice.id), 120, 120))
    ]);
    const imgs = { dish: dishImg, pip: pipImg, spice: (id) => spiceImgs[blend.findIndex((b) => b.spice.id === id)] };
    const sides = {};
    for (const [side, draw] of [['front', drawFront], ['back', drawBack]]) {
      const blob = await toBlob(draw(result, imgs));
      sides[side] = { blob, url: URL.createObjectURL(blob) };
    }
    return { ...sides, width: W, height: H };
  }

  function filename(result, side = 'front') {
    const slug = result.dish.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return `secret-ingredient-${slug}-${side}.png`;
  }

  SI.card = { render, filename, W, H };
})(globalThis.SI = globalThis.SI || {});

  <script>
/*
 * UI controller. Owns session state and renders one screen at a time.
 * All interpretation lives in js/engine; all content in js/data.
 * Nothing is persisted: answers live only in memory for this session.
 */
(function (SI) {
  const app = document.getElementById('app');
  const hud = document.getElementById('hud-progress');
  const { dish: dishArt, cloche, star } = SI.art;
  const { pip, spice: spiceArt } = SI.chars;

  const problems = SI.engine.validateContent();
  if (problems.length) console.warn('[Secret Ingredient] content problems:', problems);

  /* Pipi reacts to each answer. The reaction follows the answer's strongest hidden
     signal, but the lines never name a trait, so nothing about the scoring leaks. */
  const REACTIONS = {
    explore: { mood: 'star', lines: ['Ooh, sounds fun!', 'Ooh, exciting!', 'Ooh, let’s go!'] },
    energy: { mood: 'cheer', lines: ['Woohoo!', 'Let’s gooo!', 'Yay!'] },
    steady: { mood: 'happy', lines: ['Nice and cosy.', 'Sounds lovely.', 'Ahh, perfect.'] },
    warmth: { mood: 'love', lines: ['Aww, that’s sweet.', 'Aww!', 'So lovely!'] },
    space: { mood: 'calm', lines: ['Mmm, peaceful.', 'Ahh, bliss.', 'Mmm, nice.'] },
    observe: { mood: 'think', lines: ['Hmm, interesting…', 'Ooh, tell me more.', 'Hmm, I see…'] },
    drive: { mood: 'determined', lines: ['Yes! Go for it!', 'Ooh, fierce!', 'You got this!'] },
    flow: { mood: 'wink', lines: ['Easy-breezy!', 'Love that.', 'Go with it!'] },
    play: { mood: 'laugh', lines: ['Hehe, love it!', 'Haha, yes!', 'Hehe!'] }
  };

  /* Saving the card: the claude.ai viewer offers a downloads capability; a normal
     browser tab can use a download link; anywhere else, long-press to save. */
  const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  let downloads = null;
  const downloadsReady = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('downloads').then((d) => { downloads = d; return d; }, () => null)
    : Promise.resolve(null);

  let state;
  function freshState() {
    return { screen: 'welcome', questions: SI.engine.selectQuestions(), index: 0, answers: {}, result: null, card: null, cardSide: 'front', cardRevealed: false };
  }

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function topSignal(option) {
    return SI.DIMENSIONS.reduce((best, d) => ((option.s[d] || 0) > (option.s[best] || 0) ? d : best), SI.DIMENSIONS[0]);
  }
  function reactionFor(q, index) {
    const r = REACTIONS[topSignal(q.options[index])];
    return { mood: r.mood, line: r.lines[(state.index + index) % r.lines.length] };
  }

  function pipRow(mood, line, id = '', cls = '') {
    return `<div class="pip-row ${cls}"><div class="pip-box" ${id ? `id="${id}-pip"` : ''}>${pip(mood)}</div>
      <p class="bubble" ${id ? `id="${id}-bubble"` : ''} aria-hidden="true">${esc(line)}</p></div>`;
  }

  /* ---------- Screens ----------
     Every screen is a column: a body that holds the content, and a dock pinned to the
     bottom of the viewport that holds the next step. The body only scrolls when a
     screen genuinely can't fit; the dock never scrolls away. */

  function welcome() {
    return `<section class="screen welcome" aria-labelledby="h">
      <div class="body">
        <div class="card">
          ${pipRow('wave', 'Hi, I’m Pipi! Shall we play?')}
          <h1 id="h" tabindex="-1">Let’s get to know you.</h1>
          <p class="lede">Everyone has a little something that makes them, well, them.</p>
          <div class="body-copy">
            <p>We’re going to ask you a few questions about how you see the world, the things you enjoy, and the little choices you make.</p>
            <p>There are no right or wrong answers. Don’t overthink it, just go with what feels right.</p>
            <p>You might discover something unexpected about yourself.</p>
          </div>
        </div>
      </div>
      <div class="dock dock-stack">
        <button class="btn btn-primary btn-wide" data-action="start">Let’s go</button>
        <p class="meta">${state.questions.length} quick questions · about 3 minutes</p>
      </div>
    </section>`;
  }

  function question() {
    const q = state.questions[state.index];
    const chosen = state.answers[q.id];
    const n = state.questions.length;
    const options = q.options.map((o, i) => `
      <label class="option">
        <input type="radio" name="answer" value="${i}" ${chosen === i ? 'checked' : ''}>
        <span class="badge" aria-hidden="true">${'ABCDEF'[i]}</span>
        <span class="opt-text">${esc(o.text)}</span>
      </label>`).join('');
    const idle = state.index === 0 ? { mood: 'happy', line: 'Go with your gut!' } : { mood: 'think', line: 'Hmm, what’ll it be?' };
    // Coming back to an answered question: the answer is kept, and tapping any option moves on again.
    const r = chosen != null ? { mood: 'think', line: 'Tap your answer to carry on.' } : idle;
    return `<section class="screen question">
      <div class="body">
        <div class="card q-card entering${qDir === 'back' ? ' from-left' : ''}" id="q-form">
          <div class="q-head"><p class="q-title">${esc(q.title)}</p><p class="q-count">${state.index + 1} / ${n}</p></div>
          <h2 id="h" tabindex="-1">${esc(q.prompt)}</h2>
          <div class="options" role="radiogroup" aria-labelledby="h">${options}</div>
        </div>
      </div>
      <div class="dock dock-row">
        <button class="btn btn-plain btn-small" data-action="back" aria-label="Back">‹ Back</button>
        <div class="dock-pip">${pipRow(r.mood, r.line, 'q', 'mini')}</div>
      </div>
    </section>`;
  }

  function transition() {
    return `<section class="screen transition">
      <div class="body">
        <div class="card">
          <div class="orb" aria-hidden="true"><span></span><span><div class="pip-box orb-pip">${pip('star')}</div></span></div>
          <h1 id="h" tabindex="-1">Everyone has a signature.</h1>
          <div class="body-copy">
            <p>It’s in the choices you make, the energy you bring into a room, and the things that make you who you are.</p>
            <p>Some qualities are obvious. Others take a little longer to discover.</p>
            <p>We’ve picked up a few patterns in your answers.</p>
          </div>
          <p class="ready">Let’s see what they look like.</p>
        </div>
      </div>
      <div class="dock dock-stack">
        <button class="btn btn-primary btn-wide" data-action="blend">Discover my blend</button>
        <button class="btn-link" data-action="back">Change an answer</button>
      </div>
    </section>`;
  }

  /* The blend at a glance: one gauge, each slice showing its spice character and share.
     Each slice is a button that brings that spice's card into view. */
  function gauge(blend, small = false, linked = false) {
    const segs = blend.map((b, i) => {
      const inner = `<span class="g-icon">${spiceArt(b.spice.id)}</span><span class="g-pct">${b.pct}%</span>`;
      const style = `flex:${b.pct} 1 0;background:${b.spice.colour};color:${b.spice.text};animation-delay:${0.12 * i}s`;
      const cls = 'g-seg' + (b.pct <= 10 || (blend.length >= 5 && b.pct <= 15) ? ' narrow' : '');
      return linked
        ? `<button class="${cls}" style="${style}" data-action="show-spice" data-index="${i}" aria-label="${esc(`${b.pct}% ${b.spice.name}. Show details`)}">${inner}</button>`
        : `<div class="${cls}" style="${style}">${inner}</div>`;
    }).join('');
    const label = 'Blend: ' + blend.map((b) => `${b.pct}% ${b.spice.name}`).join(', ');
    return linked
      ? `<div class="gauge ${small ? 'gauge-small' : ''}" role="group" aria-label="${esc(label)}">${segs}</div>`
      : `<div class="gauge ${small ? 'gauge-small' : ''}" role="img" aria-label="${esc(label)}">${segs}</div>`;
  }

  function blendScreen() {
    const r = state.result, t = r.text;
    const rows = r.blend.map((b, i) => `
      <li class="spice-row" id="spice-${i}" style="--c:${b.spice.colour}">
        <div class="spice-pic" style="--pct:${b.pct};--c:${b.spice.colour}" aria-hidden="true"><div class="spice-plate">${spiceArt(b.spice.id)}</div></div>
        <div class="spice-body">
          <div class="spice-head"><h3>${esc(b.spice.name)}</h3><span class="pct">${b.pct}%</span></div>
          <p class="role"><span class="role-tag">${esc(t.spices[i].role)}</span><span class="essence">${esc(b.spice.essence)}</span></p>
          <p class="spice-line">${esc(t.spices[i].line)}</p>
        </div>
      </li>`).join('');
    const dots = r.blend.map((b, i) => `<button class="dot" data-action="show-spice" data-index="${i}" style="--c:${b.spice.colour}" aria-label="${esc(b.spice.name)}" ${i === 0 ? 'aria-current="true"' : ''}></button>`).join('');
    return `<section class="screen blend">
      <div class="body">
        <div class="card summary">
          <p class="eyebrow">Your spice blend</p>
          <h1 id="h" tabindex="-1">${esc(t.name)}</h1>
          <p class="overview">${esc(t.overview)}</p>
          ${gauge(r.blend, false, true)}
          <ul class="chips" aria-label="Flavour profile">${t.flavour.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>
        </div>
        <div class="mix">
          <div class="mix-head"><h2>What’s in the mix</h2><div class="dots">${dots}</div></div>
          <ol class="spice-list" id="spice-list" aria-label="Your spices, swipe for more">${rows}</ol>
        </div>
      </div>
      <div class="dock dock-row">
        <div class="dock-pip">${pipRow('wow', 'What would we cook?', 'b', 'mini')}</div>
        <button class="btn btn-primary" data-action="dish">Reveal my dish</button>
      </div>
    </section>`;
  }

  function dishScreen() {
    const r = state.result, t = r.text, d = r.dish;
    return `<section class="screen dish">
      <div class="body">
        <div class="stage">
          <div class="rays" aria-hidden="true"></div>
          <div class="plate-ring" aria-hidden="true"></div>
          ${dishArt(d)}
          ${cloche()}
          <div class="burst" aria-hidden="true">${star()}${star()}${star()}${star()}</div>
          <p class="stamp">${star()} Signature dish ${star()}</p>
          <p class="origin">${SI.flags.supported() && d.flag ? `<span class="flag" aria-hidden="true">${d.flag}</span>` : SI.art.pin()}<span>${esc(d.origin)}</span></p>
        </div>
        <div class="dish-title">
          <h1 id="h" tabindex="-1">${esc(d.name)}</h1>
          <p class="subtitle">${esc(d.subtitle)}</p>
        </div>
        <div class="card story">
          <p class="lead">${esc(t.dish.story)}</p>
          <p class="mapping">${esc(t.dish.mapping)}</p>
        </div>
      </div>
      <div class="dock dock-row">
        <button class="btn btn-plain btn-small" data-action="to-blend" aria-label="Back to my blend">‹ Blend</button>
        <div class="dock-pip"><div class="pip-box mini-solo">${pip('cheer')}</div></div>
        <button class="btn btn-primary" data-action="to-card">My card</button>
      </div>
    </section>`;
  }

  // Line icons for the card dock (stroke uses currentColor)
  const svgIcon = (d) => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const ICON = {
    share: svgIcon('<path d="M12 3v12"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M8 11H6.5A1.5 1.5 0 0 0 5 12.5v7A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5H16"/>'),
    copy: svgIcon('<rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 5.5V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h.5"/>'),
    save: svgIcon('<path d="M12 3v11"/><path d="M7.5 9.5 12 14l4.5-4.5"/><path d="M4 16v2.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V16"/>'),
    flip: svgIcon('<path d="M20 12a8 8 0 0 1-14.2 5"/><path d="M4 12a8 8 0 0 1 14.2-5"/><path d="M18.5 3v4h-4"/><path d="M5.5 21v-4h4"/>')
  };

  function cardScreen() {
    return `<section class="screen card-screen fill">
      <div class="body">
        <div class="card-head">
          <button class="btn-link" data-action="dish">‹ My dish</button>
          <h1 id="h" tabindex="-1" class="visually-hidden">Your collectible card</h1>
          <button class="btn-link" data-action="restart">Play again</button>
        </div>
        <div class="card-stage" id="card-stage">
          <div class="slot" id="slot">
            <div class="deck-backs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <div class="pop" id="pop">
              <div class="tcg loading" id="tcg">
                <p class="tcg-wait">${pip('think')}<span>Printing your card…</span></p>
              </div>
            </div>
            <div class="deck-front" aria-hidden="true"><span class="deck-handle"></span><span class="deck-label">Recipe file</span></div>
          </div>
        </div>
        <p class="share-status" id="share-status" aria-live="polite"></p>
      </div>
      <div class="dock dock-buttons">
        <button class="btn btn-plain btn-icon" data-action="flip" id="flip-btn" aria-controls="tcg" aria-label="Flip the card" title="Flip" disabled>${ICON.flip}</button>
        <button class="btn btn-plain btn-icon" data-action="save" id="save-btn" aria-label="Save front" title="Save this side" hidden disabled>${ICON.save}</button>
        <button class="btn btn-plain btn-icon" data-action="copy" id="copy-btn" aria-label="Copy result" title="Copy result">${ICON.copy}</button>
        <button class="btn btn-primary btn-small share" data-action="share-card" id="share-btn" disabled>${ICON.share}<span>Share</span></button>
      </div>
    </section>`;
  }

  const SCREENS = { welcome, question, transition, blend: blendScreen, dish: dishScreen, card: cardScreen };

  /* ---------- Rendering ---------- */

  function renderHud() {
    if (state.screen !== 'question') { hud.innerHTML = ''; return; }
    const n = state.questions.length;
    const answered = state.questions.filter((q) => state.answers[q.id] != null).length;
    hud.innerHTML = state.questions.map((q, i) => star(state.answers[q.id] != null ? 'on' : (i === state.index ? 'now' : ''))).join('');
    hud.setAttribute('aria-label', `${answered} of ${n} answered`);
  }

  function render(focus = true) {
    clearTimeout(advanceTimer);
    app.innerHTML = SCREENS[state.screen]();
    document.body.dataset.screen = state.screen;
    renderHud();
    if (stageObserver) stageObserver.disconnect();
    if (state.screen === 'card') { if (stageObserver) stageObserver.observe(document.getElementById('card-stage')); setupCard(); }
    if (state.screen === 'blend') wireCarousel();
    if (state.screen === 'question') settleQuestion();
    if (focus) {
      app.scrollTop = 0;
      window.scrollTo(0, 0);
      const h = document.getElementById('h');
      if (h) h.focus({ preventScroll: true });
    }
  }

  function go(screen) { state.screen = screen; render(); }

  /* Blend carousel: dots and gauge slices bring a spice into view; swiping updates the dots. */
  function showSpice(i) {
    const item = document.getElementById('spice-' + i);
    const list = document.getElementById('spice-list');
    if (!item || !list) return;
    list.scrollTo({ left: item.offsetLeft - (list.clientWidth - item.clientWidth) / 2, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    markDot(i);
  }
  function markDot(i) {
    app.querySelectorAll('.dot').forEach((d, k) => { if (k === i) d.setAttribute('aria-current', 'true'); else d.removeAttribute('aria-current'); });
    app.querySelectorAll('.g-seg').forEach((g, k) => g.classList.toggle('active', k === i));
  }
  function wireCarousel() {
    const list = document.getElementById('spice-list');
    if (!list) return;
    let raf = 0;
    list.addEventListener('scroll', () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const mid = list.scrollLeft + list.clientWidth / 2;
        let best = 0, bestD = Infinity;
        [...list.children].forEach((li, k) => { const d = Math.abs(li.offsetLeft + li.clientWidth / 2 - mid); if (d < bestD) { bestD = d; best = k; } });
        markDot(best);
      });
    }, { passive: true });
    markDot(0);
  }

  /* Card fits the space between the heading and the dock. */
  function sizeCard() {
    const stage = document.getElementById('card-stage');
    const tcg = document.getElementById('tcg');
    if (!stage || !tcg) return;
    const w = Math.max(160, Math.min(stage.clientWidth, (stage.clientHeight - 12) * 750 / 1050, 440));
    tcg.style.width = Math.floor(w) + 'px';
  }
  window.addEventListener('resize', sizeCard);
  const stageObserver = typeof ResizeObserver === 'function' ? new ResizeObserver(sizeCard) : null;

  function react(prefix, mood, line) {
    const box = document.getElementById(prefix + '-pip');
    const bubble = document.getElementById(prefix + '-bubble');
    if (box) {
      box.innerHTML = pip(mood);
      box.classList.remove('react'); void box.offsetWidth; box.classList.add('react');
    }
    if (bubble) {
      bubble.textContent = line;
      bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop');
    }
  }

  /* ---------- Card ---------- */

  function cardAlt(side) {
    const r = state.result, t = r.text;
    if (side === 'back') return `Back of the card, the recipe for ${t.name}: ` + r.blend.map((b, i) => `${b.pct}% ${b.spice.name}, ${t.spices[i].role.toLowerCase()}`).join('; ') + '.';
    const c = t.card;
    return `Front of the card for ${r.dish.name}, from ${r.dish.origin}: ${t.name}. Heat ${c.heat}. Strengths: ${c.strengths.join(', ')}. Weakness: ${c.weakness}. Resists: ${c.resists}. Recharges with: ${c.recharge}. Clicks with: ${c.clicks}. Signature move: ${c.moves[0].name}.`;
  }

  function cardFiles() {
    if (typeof File !== 'function' || !state.card || !state.card.front) return [];
    return ['front', 'back'].map((side) => new File([state.card[side].blob], SI.card.filename(state.result, side), { type: 'image/png' }));
  }

  function visibleSide() { return state.cardSide === 'back' ? 'back' : 'front'; }

  function updateCardButtons() {
    if (state.screen !== 'card') return;
    const ready = !!(state.card && state.card.front);
    const save = document.getElementById('save-btn');
    const share = document.getElementById('share-btn');
    const flip = document.getElementById('flip-btn');
    if (!save) return;
    const canSave = !!downloads || !inFrame;
    save.hidden = !canSave; save.disabled = !ready;
    save.setAttribute('aria-label', visibleSide() === 'back' ? 'Save back' : 'Save front');
    share.disabled = !ready || sharing;
    flip.disabled = !ready;
    flip.setAttribute('aria-label', visibleSide() === 'back' ? 'Show the front' : 'Flip the card');
  }

  function showCard() {
    const holder = document.getElementById('tcg');
    if (!holder || !state.card) return;
    holder.classList.remove('loading');
    if (state.card.error) {
      holder.innerHTML = `<p class="tcg-wait">${pip('think')}<span>Your card couldn’t be printed here. Copy your result below instead.</span></p>`;
      return;
    }
    holder.innerHTML = `<div class="tcg-inner">
        <button class="tcg-face tcg-front" data-action="flip" aria-label="${esc(cardAlt('front') + ' Select to flip.')}"><img src="${state.card.front.url}" alt="" width="${SI.card.W}" height="${SI.card.H}" draggable="false"><span class="holo" aria-hidden="true"></span><span class="card-cloche" aria-hidden="true">${cloche()}</span></button>
        <button class="tcg-face tcg-back" data-action="flip" aria-label="${esc(cardAlt('back') + ' Select to flip.')}"><img src="${state.card.back.url}" alt="" width="${SI.card.W}" height="${SI.card.H}" draggable="false"><span class="holo" aria-hidden="true"></span></button>
      </div>`;
    holder.classList.add('dealt');
    holder.classList.toggle('flipped', visibleSide() === 'back');
    // First time on this card: it pops out of the recipe file, then the cloche lifts.
    const slot = document.getElementById('slot');
    if (slot && !state.cardRevealed) {
      state.cardRevealed = true;
      slot.classList.add('revealing');
      nudgeLater(reduced() ? 0 : REVEAL_MS);
    } else nudgeLater(0);
    setFaceAccess();
    sizeCard();
    updateCardButtons();
  }

  function setFaceAccess() {
    const front = app.querySelector('.tcg-front'), back = app.querySelector('.tcg-back');
    if (!front) return;
    const showingBack = visibleSide() === 'back';
    front.tabIndex = showingBack ? -1 : 0; front.setAttribute('aria-hidden', String(showingBack));
    back.tabIndex = showingBack ? 0 : -1; back.setAttribute('aria-hidden', String(!showingBack));
  }

  /* Until someone has flipped a card once, it gives a little jiggle every few seconds. */
  const REVEAL_MS = 2700;
  let flipLearned = false, nudgeTimer = 0;
  try { flipLearned = localStorage.getItem('si-flip-learned') === '1'; } catch (e) { /* storage unavailable */ }
  function nudgeLater(ms) {
    clearTimeout(nudgeTimer);
    if (flipLearned) return;
    nudgeTimer = setTimeout(() => { const pop = document.getElementById('pop'); if (pop && !flipLearned) pop.classList.add('nudge'); }, ms);
  }
  function learnFlip() {
    clearTimeout(nudgeTimer);
    const pop = document.getElementById('pop'); if (pop) pop.classList.remove('nudge');
    if (flipLearned) return;
    flipLearned = true;
    try { localStorage.setItem('si-flip-learned', '1'); } catch (e) { /* storage unavailable */ }
  }

  function flipCard() {
    const holder = document.getElementById('tcg');
    if (!holder || !state.card || !state.card.front) return;
    learnFlip();
    state.cardSide = visibleSide() === 'back' ? 'front' : 'back';
    holder.classList.toggle('flipped', state.cardSide === 'back');
    setFaceAccess();
    updateCardButtons();
  }

  function setupCard() {
    sizeCard();
    const forResult = state.result;
    if (state.card && state.card.result === forResult) { showCard(); return; }
    SI.card.render(forResult).then(
      (c) => {
        if (state.result === forResult) { state.card = { ...c, result: forResult }; showCard(); }
        else { URL.revokeObjectURL(c.front.url); URL.revokeObjectURL(c.back.url); }
      },
      (err) => { console.warn('[Secret Ingredient] card render failed', err); if (state.result === forResult) { state.card = { error: true, result: forResult }; showCard(); } }
    );
    updateCardButtons();
  }

  function clearCard() {
    if (state && state.card && state.card.front) { URL.revokeObjectURL(state.card.front.url); URL.revokeObjectURL(state.card.back.url); }
    if (state) state.cardSide = 'front';
  }

  function saveCard() {
    if (!state.card || !state.card.front) return;
    const side = visibleSide();
    const filename = SI.card.filename(state.result, side);
    const saved = side === 'back' ? 'Back of the card saved!' : 'Front of the card saved!';
    if (downloads) {
      downloads.save({ filename, data: state.card[side].blob }).then(
        () => setStatus(saved),
        (err) => {
          if (err && err.code === 'declined') { setStatus(''); return; }
          if (err && err.code === 'rate_limited') { setStatus('One moment, then try again.'); return; }
          setStatus('Saving isn’t available here. Long-press or right-click the card to save it.');
        }
      );
      return;
    }
    const a = document.createElement('a');
    a.href = state.card[side].url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setStatus(saved);
  }

  /*
   * Share both sides in one action.
   * 1. Where the browser can share image files (most phones), one share sheet carries
   *    the front and back as two separate PNGs plus the result text.
   * 2. Otherwise both PNGs are saved one after the other (on claude.ai each save is
   *    confirmed by the viewer; in the Claude mobile apps that opens the share sheet).
   * 3. Last resort: long-press / right-click each side.
   */
  let sharing = false;
  function canShareFiles(files) {
    try { return files.length === 2 && !!navigator.share && !!navigator.canShare && navigator.canShare({ files }); } catch (e) { return false; }
  }
  function shareCard() {
    if (!state.card || !state.card.front || sharing) return;
    const files = cardFiles();
    if (!canShareFiles(files)) { saveBoth(); return; }
    sharing = true; updateCardButtons();
    const done = () => { sharing = false; updateCardButtons(); };
    navigator.share({ files, title: 'The Secret Ingredient', text: state.result.text.share }).then(
      () => { setStatus('Shared! Both sides of your card are on their way.'); done(); },
      (err) => {
        done();
        if (err && err.name === 'AbortError') { setStatus(''); return; }
        saveBoth(); // sharing is blocked here (e.g. inside an embedded page), so save both instead
      }
    );
  }

  function saveBoth() {
    const sides = ['front', 'back'];
    const done = () => { sharing = false; updateCardButtons(); };
    if (downloads) {
      sharing = true; updateCardButtons();
      let saved = 0;
      const step = (i) => {
        if (i >= sides.length) { setStatus(saved === 2 ? 'Front and back saved! Share them from your photos or downloads.' : ''); done(); return; }
        setStatus(`Saving ${sides[i]} (${i + 1} of 2)…`);
        downloads.save({ filename: SI.card.filename(state.result, sides[i]), data: state.card[sides[i]].blob }).then(
          () => { saved += 1; step(i + 1); },
          (err) => {
            const code = err && err.code;
            if (code === 'declined') { setStatus(saved ? 'Front saved. Tap Share card again for the back.' : ''); done(); return; }
            if (code === 'rate_limited') { setTimeout(() => step(i), 800); return; }
            setStatus('Saving isn’t available here. Long-press or right-click each side to save it.'); done();
          }
        );
      };
      step(0);
      return;
    }
    if (!inFrame) {
      sides.forEach((side, i) => setTimeout(() => {
        const a = document.createElement('a');
        a.href = state.card[side].url; a.download = SI.card.filename(state.result, side);
        document.body.appendChild(a); a.click(); a.remove();
      }, i * 400));
      setStatus('Front and back downloaded! Share them from your downloads.');
      return;
    }
    setStatus('Long-press or right-click each side to save it, then share.');
  }

  // Gentle holographic tilt that follows the pointer
  app.addEventListener('pointermove', (e) => {
    const el = e.target.closest && e.target.closest('.tcg:not(.loading)');
    if (!el || e.pointerType === 'touch') return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    el.style.setProperty('--ry', ((px - 0.5) * 14).toFixed(2) + 'deg');
    el.style.setProperty('--rx', ((0.5 - py) * 14).toFixed(2) + 'deg');
    el.style.setProperty('--shine', (px * 100).toFixed(1) + '%');
  });
  app.addEventListener('pointerout', (e) => {
    const el = e.target.closest && e.target.closest('.tcg');
    if (el && !el.contains(e.relatedTarget)) { el.style.setProperty('--rx', '0deg'); el.style.setProperty('--ry', '0deg'); }
  });

  /* ---------- Actions ---------- */

  let advanceTimer = 0;
  const ADVANCE_MS = 750;

  // Question-to-question transition: the answered card slides away, the next one slides in.
  // Taps are ignored while a card is moving, so a tap always lands on a still card.
  let qDir = 'next', leaving = false;
  const reduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const Q_OUT_MS = 170, Q_IN_MS = 240;
  function moving() { return leaving || !!app.querySelector('.q-card.entering'); }
  function leaveQuestion(then) {
    const card = app.querySelector('.q-card');
    if (!card || reduced()) { then(); return; }
    if (leaving) return;
    leaving = true;
    card.classList.remove('entering');
    card.classList.add('leaving');
    setTimeout(() => { leaving = false; then(); }, Q_OUT_MS);
  }
  function settleQuestion() {
    const card = app.querySelector('.q-card.entering');
    if (!card) return;
    if (reduced()) { card.classList.remove('entering'); return; }
    setTimeout(() => card.classList.remove('entering'), Q_IN_MS);
  }

  function choose(index) {
    if (moving()) return;
    const q = state.questions[state.index];
    if (index < 0 || index >= q.options.length) return;
    state.answers[q.id] = index;
    const input = app.querySelector(`input[name="answer"][value="${index}"]`);
    if (input && !input.checked) input.checked = true;
    const r = reactionFor(q, index);
    react('q', r.mood, r.line);
    renderHud();
    // Move on by itself once Pipi has reacted; Back is always there to change it.
    clearTimeout(advanceTimer);
    const at = state.index;
    advanceTimer = setTimeout(() => { if (state.screen === 'question' && state.index === at) next(); }, ADVANCE_MS);
  }

  function next() {
    const q = state.questions[state.index];
    if (state.answers[q.id] == null) return;
    qDir = 'next';
    if (state.index < state.questions.length - 1) leaveQuestion(() => { state.index += 1; render(); });
    else leaveQuestion(() => go('transition'));
  }

  function back() {
    if (state.screen === 'transition') { state.index = state.questions.length - 1; qDir = 'back'; go('question'); qDir = 'next'; return; }
    if (state.index === 0) { go('welcome'); return; }
    if (leaving) return;
    qDir = 'back'; state.index -= 1; render(); qDir = 'next';
  }

  function computeResult() {
    const answers = state.questions.map((q) => ({ questionId: q.id, optionIndex: state.answers[q.id] }));
    const result = SI.engine.interpret(answers);
    const same = state.result && JSON.stringify(state.result.blend.map((b) => [b.spice.id, b.pct])) === JSON.stringify(result.blend.map((b) => [b.spice.id, b.pct])) && state.result.dish === result.dish;
    if (!same) { clearCard(); state.card = null; state.result = result; state.cardRevealed = false; }
  }

  function setStatus(msg) { const el = document.getElementById('share-status'); if (el) el.textContent = msg; }

  function copyResult() {
    const text = state.result.text.share;
    try {
      navigator.clipboard.writeText(text).then(
        () => setStatus('Copied! Paste it anywhere.'),
        () => setStatus('Copying isn’t available here. Try Share instead.')
      );
    } catch (e) {
      setStatus('Copying isn’t available here. Try Share instead.');
    }
  }

  app.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn || btn.disabled) return;
    switch (btn.dataset.action) {
      case 'start': state.index = 0; go('question'); break;
      case 'next': next(); break;
      case 'back': back(); break;
      case 'blend': computeResult(); go('blend'); break;
      case 'dish': go('dish'); break;
      case 'to-card': go('card'); break;
      case 'show-spice': showSpice(Number(btn.dataset.index)); break;
      case 'to-blend': go('blend'); break;
      case 'restart': clearCard(); state = freshState(); render(); break;
      case 'copy': copyResult(); break;
      case 'save': saveCard(); break;
      case 'flip': flipCard(); break;
      case 'share-card': shareCard(); break;
    }
  });

  app.addEventListener('change', (e) => {
    if (e.target.name === 'answer') choose(Number(e.target.value));
  });
  // Tapping the answer that's already selected (e.g. after Back) doesn't fire "change", so move on from here.
  app.addEventListener('click', (e) => {
    if (e.target.name === 'answer' && state.screen === 'question') choose(Number(e.target.value));
  });


  document.addEventListener('keydown', (e) => {
    if (state.screen !== 'question' || e.altKey || e.ctrlKey || e.metaKey) return;
    if (/^[1-6]$/.test(e.key)) {
      const idx = Number(e.key) - 1;
      if (idx < state.questions[state.index].options.length) {
        e.preventDefault();
        choose(idx);
        const input = app.querySelector(`input[name="answer"][value="${idx}"]`);
        if (input) input.focus();
      }
    } else if (e.key === 'Enter' && e.target.matches && e.target.matches('input[name="answer"], body, h2')) {
      e.preventDefault();
      next();
    }
  });

  downloadsReady.then(updateCardButtons);

  state = freshState();
  render(false);

  // Exposed for automated tests and debugging only.
  SI.app = { getState: () => state, render: () => render(false) };
})(globalThis.SI = globalThis.SI || {});

</script>
</body>
</html>
